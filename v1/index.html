<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>sim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 style="font-size: 26px;">SIM 😲😲😲😲😲😲😲😲😲😲😲😲😲😲</h1>

  <!-- Tabs Section -->
  <div class="tab-container">
    <div class="tab-group">
      <button class="tab-button" data-sim="distortion">lens distortions</button>
      <button class="tab-button active" data-sim="prism">prism dispersion</button>
      <button class="tab-button" data-sim="rainbow">rainbow</button>
      <button class="tab-button" data-sim="raymarch">diffuse & specular scattering</button>
    </div>

    <div id="distortion-tabs" class="sub-tab-group" style="display: none;">
      <button class="sub-tab-button active" data-map="task_5">task 5</button>
      <button class="sub-tab-button" data-map="task_6&7">task 6 & 7</button>
      <button class="sub-tab-button" data-map="task_8">task 8</button>
      <button class="sub-tab-button" data-map="task_9">task 9</button>
      <button class="sub-tab-button" data-map="task_10">task 10</button>
    </div>
  </div>

  <!-- Canvas -->
  <canvas id="glcanvas" width="800" height="600"></canvas>

  <!-- Controls -->
  <div class="controls">
    <p><b>controls</b></p>

    <!-- universal controls -->
    <div class="control-row" id="v-scale">
      <label>viewport scale: <span id="viewport-scale-value">6.0</span></label>
      <input type="range" id="viewport-scale" min="1.5" max="15.0" step="0.1" value="6.0">
    </div>

    <!-- sim specific controls -->

    <div id="lens-controls" style="display: none;">
      <div class="control-row" id="focal-length-control">
        <label>focal length: <span id="focal-length-value">1.5</span></label>
        <input type="range" id="focal-length" min="0.5" max="5.0" step="0.1" value="1.5">
      </div>
    
      <div class="control-row">
        <label>image scale: <span id="image-scale-value">0.3</span></label>
        <input type="range" id="image-scale" min="0.1" max="3.0" step="0.05" value="0.3">
      </div>

      <div id="task10-controls" style="display: none;">
        <div class="control-row">
          <label>Rf: <span id="rf-value">1.0</span></label>
          <input type="range" id="rf-slider" min="0.1" max="5.0" step="0.1" value="1.0">
        </div>
        <div class="control-row">
          <label>arc / ° : <span id="arc-value">160</span></label>
          <input type="range" id="arc-slider" min="30" max="360" step="1" value="160">
        </div>
      </div>
    </div>

    <div id="rainbow-controls" style="display: none;">
      <div class="control-row">
        <label>anti-solar angle / ° : <span id="alpha-value">5</span></label>
        <input type="range" id="alpha-slider" min="0" max="90" step="1" value="5">
      </div>
      <div class="control-row">
        <label>height / m: <span id="height-value">0</span></label>
        <input type="range" id="height-slider" min="0" max="5" step="0.1" value="0">
      </div>
      <div class="control-row">
        <label>rainbow distance / m: <span id="rainbow-distance-value">8.0</span></label>
        <input type="range" id="rainbow-distance-slider" min="0" max="30" step="0.05" value="8">
      </div>
      <div class="control-row" style="display: none;">
        <label>number of bands: <span id="num-bands-value">50</span></label>
        <input type="range" id="num-bands-slider" min="0" max="128" step="1" value="50">
      </div>
      <div class="control-row" style="display: none;">
        <label>band spread: <span id="spread-value">0.005</span></label>
        <input type="range" id="spread-slider" min="0.0" max="0.5" step="0.001" value="0.005">
      </div>
    </div>

    <div id="prism-controls">
      <div class="control-row">
        <label>angle of incidence / ° : <span id="theta-i-value">16.7</span></label>
        <input type="range" id="theta-i-slider" min="0.0" max="70.0" step="0.0001" value="16.7">
      </div>
      <div class="control-row">
        <label>alpha / ° : <span id="prism-alpha-value">60.0</span></label>
        <input type="range" id="prism-alpha-slider" min="10.0" max="60.0" step="0.0001" value="60.0">
      </div>
    </div>

    <div id="raymarch-controls" style="display: none;">
      <div class="control-row">
        <label>field of view / ° : <span id="fov-value">70.0</span></label>
        <input type="range" id="fov-slider" min="30.0" max="960.0" step="0.5" value="70.0">
      </div>
      <div class="control-row">
        <label>radius_1 / m : <span id="r1-value">1.0</span></label>
        <input type="range" id="r1-slider" min="0.1" max="3.0" step="0.01" value="1.0">
      </div>
      <div class="control-row">
        <label>radius_2 / m : <span id="r2-value">0.5</span></label>
        <input type="range" id="r2-slider" min="0.05" max="1.0" step="0.01" value="0.5">
      </div>
      <div class="control-row">
        <label>
          <input type="checkbox" id="fract-toggle" />
          toggle fract
        </label>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</body>
</html>
